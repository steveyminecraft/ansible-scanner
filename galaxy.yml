---
namespace: steveyminecraft
name: scanner
version: 0.7.0
readme: README.md
authors:
  - steveyminecraft
description: >-
  Host Linux security scanning (ClamAV on-demand, Lynis, AIDE, rkhunter)
  for Devuan, Debian, and Ubuntu. No systemd required. No clamd. No auto-delete.
license:
  - Apache-2.0
tags:
  - security
  - clamav
  - linux
  - ansible
  - devuan
repository: https://github.com/steveyminecraft/ansible-scanner
documentation: https://github.com/steveyminecraft/ansible-scanner#readme
build_ignore:
  - .ansible
  - .ansible/**
  - .cache
  - .cache/**
  - .git
  - .git/**
  - .mypy_cache
  - .mypy_cache/**
  - .pytest_cache
  - .pytest_cache/**
  - .venv
  - .venv/**
  - .vagrant
  - .vagrant/**
  - env
  - env/**
dependencies:
  ansible.posix: ">=2.2.0"
  community.general: ">=9.0.0"
