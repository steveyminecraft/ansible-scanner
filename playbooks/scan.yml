---
- name: Run security-scan
  hosts: all
  become: true
  gather_facts: false
  serial: "{{ scanner_serial | default(1) }}"
  vars:
    scanner_scan_type: quick
  tasks:
    - name: Run malware scan
      ansible.builtin.command:
        cmd: /usr/local/sbin/security-scan {{ scanner_scan_type }}
      register: scanner_quick
      changed_when: false

    - name: Show scan stdout
      ansible.builtin.debug:
        var: scanner_quick.stdout
