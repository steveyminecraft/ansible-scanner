---
- name: AIDE baseline update (not in v1)
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  vars:
    scanner_aide_confirm_update: false
  tasks:
    - name: Require confirm extra-var
      ansible.builtin.assert:
        that:
          - scanner_aide_confirm_update | bool
        fail_msg: Pass -e scanner_aide_confirm_update=true (AIDE is still unimplemented in v1)

    - name: AIDE update not implemented
      ansible.builtin.fail:
        msg: AIDE update playbook is a v1 stub.
