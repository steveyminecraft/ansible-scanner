---
# v1 LAN inventory. SSH key auth. Apply only when Richard asks.
all:
  children:
    scan_prod:
      hosts:
        prod-01:
          ansible_host: 172.16.7.20
          ansible_user: service
          ansible_python_interpreter: /usr/bin/python3
    scan_pihole:
      hosts:
        pihole-01:
          ansible_host: 172.16.7.25
          ansible_user: service
          ansible_python_interpreter: /usr/bin/python3
          scanner_cron_quick_schedule: "20 3 * * 0"
          scanner_schedule_monthly_jobs:
            - schedule: "20 2 * * 6"
              command: full
            - schedule: "20 6 * * 6"
              command: integrity
        pihole-02:
          ansible_host: 172.16.7.30
          ansible_user: service
          ansible_python_interpreter: /usr/bin/python3
          scanner_cron_quick_schedule: "20 5 * * 0"
          scanner_schedule_monthly_jobs:
            - schedule: "20 3 * * 6"
              command: full
            - schedule: "20 7 * * 6"
              command: integrity
    scan_backup:
      hosts:
        backup-01:
          ansible_host: 172.16.7.11
          ansible_user: richardl
          ansible_python_interpreter: /usr/bin/python3
    scan_desktop:
      hosts:
        silver-laptop:
          ansible_host: 172.16.6.60
          ansible_user: talon
          ansible_python_interpreter: /usr/bin/python3
