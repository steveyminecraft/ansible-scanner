---
scanner_quick_paths:
  - /tmp
  - /var/tmp
  - /home
  - /root
  - /usr/local
  - /opt
scanner_exclude_paths:
  - /proc
  - /sys
  - /dev
  - /run
  - /var/lib/docker
  - /var/lib/containerd
  - /snap
  - /mnt/array01
scanner_cron_quick_schedule: "30 4 * * 0"
scanner_schedule_jobs:
  - schedule: "30 4 * * 0"
    command: quick
  - schedule: "40 4 * * 0"
    command: audit
  - schedule: "50 4 * * 0"
    command: rootkit
